name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The pinned .NET SDK, FFmpeg and mpv; bootstrap.ps1 verifies every download against the lock files.
      - uses: actions/cache@v6
        with:
          path: |
            .tools/dotnet-sdk.zip
            .tools/media/*.zip
          key: tools-${{ hashFiles('docs/release/toolchain-lock.json', 'docs/release/media-tools-lock.json') }}

      - name: Bootstrap
        shell: powershell
        run: .\scripts\bootstrap.ps1

      # The UI smoke test needs an interactive desktop session, which hosted runners do not offer.
      - name: Build, test and publish
        shell: powershell
        run: .\scripts\build.ps1 -SkipUiSmoke

      - name: Package
        shell: powershell
        run: python scripts\release\package-portable.py

      - uses: actions/upload-artifact@v7
        with:
          name: FlixyPix-portable
          path: artifacts/FlixyPix-*-win-x64.zip
          if-no-files-found: error
