name: Translation correction
description: A text in one of the interface languages is wrong or unnatural.
labels: [translation]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Deutsch, Español, Français, Italiano, Nederlands, Polski, Português (Brasil), Русский, 日本語, English]
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: input
    id: suggestion
    attributes:
      label: Suggested text
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Where it appears
      placeholder: Settings → Appearance
